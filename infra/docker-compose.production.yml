name: Beauty API Salon

services:
  db:
    image: postgres:18-alpine
    env_file:
      - ./.env
    environment:
      PGDATA: /var/lib/postgresql/18/docker/pgdata
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - ./pgdata:/var/lib/postgresql/18/docker/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3.13-management
    env_file:
      - ./.env
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS}"
      RABBITMQ_DEFAULT_VHOST: "${RABBITMQ_VHOST}"
    ports:
    - "${RABBITMQ_PORT}:${RABBITMQ_PORT}"
    - "${RABBITMQ_MANAGEMENT_PORT}:${RABBITMQ_MANAGEMENT_PORT}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmqctl status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  app:
    image: ${DOCKERHUB_USERNAME}/api-for-beauty-salon2-app:latest
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn src.main:app --host 0.0.0.0 --port ${APP_PORT}
      "
    env_file:
    - ./.env
    environment:
      PYTHONPATH: /app/src
      POSTGRES_HOST: ${DOCKER_POSTGRES_HOST}
      RABBITMQ_HOST: ${DOCKER_RABBITMQ_HOST}
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../src:/app/src
    networks:
      - backend
    restart: unless-stopped

  celery_worker:
    image: ${DOCKERHUB_USERNAME}/api-for-beauty-salon2-celery:latest
    command: celery -A celery_app.worker worker -l info
    env_file:
      - ./.env
    environment:
      PYTHONPATH: /app/src
      POSTGRES_HOST: ${DOCKER_POSTGRES_HOST}
      RABBITMQ_HOST: ${DOCKER_RABBITMQ_HOST}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  celery_beat:
    image: ${DOCKERHUB_USERNAME}/api-for-beauty-salon2-celery:latest
    command: celery -A celery_app.worker beat -l info
    env_file:
      - ./.env
    environment:
      PYTHONPATH: /app/src
      POSTGRES_HOST: ${DOCKER_POSTGRES_HOST}
      RABBITMQ_HOST: ${DOCKER_RABBITMQ_HOST}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  flower:
    image: ${DOCKERHUB_USERNAME}/api-for-beauty-salon2-flower:latest
    command: >
      sh -c '
      BROKER_API="${FLOWER_BROKER_API:-http://$$RABBITMQ_USER:$$RABBITMQ_PASS@$$DOCKER_RABBITMQ_HOST:$$RABBITMQ_MANAGEMENT_PORT/api/}" &&
      celery -A celery_app.worker flower
      --port=$$FLOWER_PORT
      $${FLOWER_BASIC_AUTH:+--basic-auth=$$FLOWER_BASIC_AUTH}
      --broker-api="$$BROKER_API"
      $${FLOWER_URL_PREFIX:+--url-prefix=$$FLOWER_URL_PREFIX}'
    env_file:
      - ./.env
    environment:
      PYTHONPATH: /app/src
      POSTGRES_HOST: ${DOCKER_POSTGRES_HOST}
      RABBITMQ_HOST: ${DOCKER_RABBITMQ_HOST}
    ports:
      - "${FLOWER_PORT}:${FLOWER_PORT}"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmq_data:

networks:
  backend:
    driver: bridge